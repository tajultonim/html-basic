<html>
  <head>
    <title>Simple html</title>
    <style>
      .blue-box {
        background-color: blue;
        height: 100px;
        width: 200px;
        color: white;
        padding-top: 10px;
        padding-left: 10px;
      }

      .red-box {
        background-color: red;
        height: 100px;
        width: 200px;
        color: white;
        margin-left: 10px;
      }

      .side-by-side {
        display: flex;
      }
    </style>
  </head>

  <body>
    <div>
      <button class="home-id">Home</button>
      <button>About</button>
      <button>Contact</button>
      <button>Facebook</button>
      <p>I am tonim</p>
    </div>
    <div class="side-by-side">
      <div class="blue-box">This is a blue box</div>
      <div class="red-box">this is a red box</div>
    </div>
  </body>
</html>
